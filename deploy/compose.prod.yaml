name: bs

x-podman:
  in_pod: false

services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:18-alpine}
    container_name: bs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-bs_chat}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - bs_pgdata:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-bs} -d ${POSTGRES_DB:-bs_chat}
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bs_pgdata:
    external: true
    name: bs_pgdata
